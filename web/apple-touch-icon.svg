<!-- iPhone のホーム画面用アイコンの元。icons/icon.svg の鍵を白地に 7 割の大きさで置く
     (iOS は透明部分を黒く塗るので背景を敷く。角丸は iOS が付ける)。
     書き出し: rsvg-convert -w 180 -h 180 apple-touch-icon.svg -o apple-touch-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="180" height="180">
  <rect width="24" height="24" fill="#ffffff"/>
  <g transform="translate(3.6 3.6) scale(0.7)" fill="none" stroke="#0FA3B1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15.5" cy="8.5" r="5.5"/>
    <path d="M11.6 12.4 3 21"/>
    <path d="M6 18l2.5 2.5"/>
    <path d="M8.5 15.5 10.5 17.5"/>
    <path d="M16.5 7.5h0"/>
  </g>
</svg>
